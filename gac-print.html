<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Characters — Grinches Attack Christmas</title>
<style>
  :root{ --christmas:#c0182a; --grinch:#1f6f1f; --neutral:#e07b1a; }
  *{box-sizing:border-box}
  html,body{margin:0}
  /* Light page background so a momentary blank state never reads as a "blue screen". */
  body{font-family:Arial,Helvetica,sans-serif;background:#e9eef2;color:#111}

  /* Control bar (hidden when printing) */
  .controls{position:sticky;top:0;z-index:10;background:#0f2c3d;color:#fff;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px}
  .controls h1{font-size:18px;margin:0 12px 0 0;font-weight:normal}
  .controls button{font-size:15px;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;
    background:#f3c969;color:#0f2c3d;font-weight:bold}
  .controls button.alt{background:#cfe0ea}
  .controls .note{font-size:12px;color:#9fc;flex:1;min-width:160px}

  .page{background:#fff;max-width:8.5in;margin:16px auto;padding:0.4in;box-shadow:0 2px 12px rgba(0,0,0,.4)}
  h2.section{font-size:20px;margin:0 0 10px;border-bottom:2px solid #333;padding-bottom:4px}

  /* ---------- Rows are the unbreakable unit ----------
     Each row of cards is a flex container the browser keeps whole. Breaking
     happens BETWEEN rows, never mid-row. */
  .cards{margin-bottom:18px}
  .row{display:flex;gap:8px;margin-bottom:8px;
    break-inside:avoid;page-break-inside:avoid;-webkit-column-break-inside:avoid}

  /* Character card — fixed quarter width inside a 4-up row. */
  .card{position:relative;flex:1 1 0;min-width:0;border-radius:8px;overflow:hidden;
    border:1px solid #999;
    break-inside:avoid;page-break-inside:avoid;-webkit-column-break-inside:avoid}
  /* Pad short rows so the last row's cards keep card width instead of stretching. */
  .card.spacer{visibility:hidden;border:none}
  .card .art{width:100%;display:block}
  .card .cap{position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(0deg,rgba(0,0,0,.82) 60%,rgba(0,0,0,0));
    color:#fff;font-size:8.5px;line-height:1.15;padding:14px 5px 4px;text-align:center}
  .card .cname{display:block;font-weight:bold;font-size:9.5px;margin-bottom:1px}

  /* Team badge: corner overlay, only in B&W mode (colour carries the team in
     colour mode; in B&W the badge marks the team explicitly). */
  .teamBadge{display:none}
  body.bw .teamBadge{display:block;position:absolute;top:4px;right:4px;
    width:26px;height:26px;object-fit:contain;z-index:2}

  /* ----- Black & white mode ----- */
  body.bw .card{border:1px solid #000;background:#fff}
  body.bw .card .art{filter:grayscale(1) contrast(1.05)}
  body.bw .card .cap{position:static;background:#fff;color:#000;
    border-top:1px solid #000;text-shadow:none;padding:4px 5px 6px}

  /* Visible error fallback so a script failure never leaves a blank screen. */
  #err{display:none;max-width:8.5in;margin:16px auto;padding:16px;background:#fff;
    border:2px solid #c0182a;border-radius:8px;color:#c0182a;font-size:14px}

  @media print{
    .controls{display:none}
    body{background:#fff}
    .page{box-shadow:none;margin:0;max-width:none;padding:0.3in}
    @page{size:letter;margin:0.3in}
    .row{break-inside:avoid;page-break-inside:avoid}
    .card{break-inside:avoid;page-break-inside:avoid}
    body.bw .card .art{
      -webkit-filter:grayscale(1) contrast(1.05) !important;
      filter:grayscale(1) contrast(1.05) !important;
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
    }
    h2.section{break-after:avoid;page-break-after:avoid}
  }
</style>
</head>
<body>
  <div class="controls">
    <h1>Print Characters — Grinches Attack Christmas</h1>
    <button onclick="window.print()">🖨️ Print</button>
    <button class="alt" id="bwToggle">Switch to Black &amp; White</button>
    <button class="alt" id="backBtn">← Back to game</button>
    <span class="note">Colour matches team: red = Christmas team, green = Grinch team, blue = moderator. In B&amp;W a team badge is added to each card.</span>
  </div>

  <div id="err">Couldn't load the character data. Try reopening the Print Characters page from the menu.</div>

  <div class="page">
    <h2 class="section">Characters</h2>
    <div class="cards" id="cards"></div>
  </div>

<script type="module">
import { GAC_ROSTER } from "./gac-roles.js?v=12";

const CARDS_PER_ROW = 4;

const TEAM_BADGE = {
  christmas: "PrintAssets/team-christmas.png",
  grinch:    "PrintAssets/team-grinch.png",
  moderator: "PrintAssets/team-neutral.png",
  neutral:   "PrintAssets/team-neutral.png",
};
const TEAM_BADGE_WHITE = {
  christmas: "PrintAssets/team-christmas-white.png",
  grinch:    "PrintAssets/team-grinch-white.png",
  moderator: "PrintAssets/team-neutral-white.png",
  neutral:   "PrintAssets/team-neutral-white.png",
};
// A thin coloured frame in colour mode so the team reads at a glance even
// before B&W badges are needed.
const TEAM_COLOR = {
  christmas: "#c0182a",
  grinch:    "#1f6f1f",
  moderator: "#1f5fa0",
  neutral:   "#1f5fa0",
};

try {
  // ---- Build character cards, grouped into unbreakable rows of 4 ----
  const cards = document.getElementById("cards");
  let row;
  GAC_ROSTER.forEach((r, i) => {
    if (i % CARDS_PER_ROW === 0){
      row = document.createElement("div");
      row.className = "row";
      cards.appendChild(row);
    }
    const team = r.team || "christmas";
    const div = document.createElement("div");
    div.className = "card";
    div.style.borderColor = TEAM_COLOR[team] || "#999";
    div.style.borderWidth = "2px";
    // Sam is the moderator — no team, so no B&W badge.
    const badgeHtml = (team === "moderator" || team === "neutral")
      ? ""
      : `<img class="teamBadge" data-team="${team}" src="${TEAM_BADGE[team] || TEAM_BADGE.neutral}" alt="${team} team">`;
    div.innerHTML = `<img class="art" src="${r.image}" alt="${r.name}">
      ${badgeHtml}
      <div class="cap"><span class="cname">${r.name}</span>${r.desc || ""}</div>`;
    row.appendChild(div);
  });
  // Pad the final card row so cards keep their quarter width.
  const cardRem = GAC_ROSTER.length % CARDS_PER_ROW;
  if (cardRem){
    for (let k = cardRem; k < CARDS_PER_ROW; k++){
      const s = document.createElement("div");
      s.className = "card spacer";
      row.appendChild(s);
    }
  }

  // ---- B&W toggle ----
  const bwBtn = document.getElementById("bwToggle");
  bwBtn.onclick = () => {
    const bw = document.body.classList.toggle("bw");
    bwBtn.textContent = bw ? "Switch to Color" : "Switch to Black & White";
    document.querySelectorAll(".teamBadge").forEach(b => {
      const team = b.dataset.team;
      b.src = (bw ? TEAM_BADGE_WHITE : TEAM_BADGE)[team] || (bw ? TEAM_BADGE_WHITE : TEAM_BADGE).neutral;
    });
    // In B&W the coloured frame becomes black; restore team colour in colour mode.
    document.querySelectorAll(".card").forEach(c => {
      if (c.classList.contains("spacer")) return;
      c.style.borderColor = bw ? "#000" : (c.dataset.teamColor || "#999");
    });
  };
  // Remember each card's team colour so the toggle can restore it.
  document.querySelectorAll(".card").forEach((c, idx) => {
    const r = GAC_ROSTER[idx];
    if (r) c.dataset.teamColor = TEAM_COLOR[r.team || "christmas"] || "#999";
  });
} catch (e){
  document.getElementById("err").style.display = "block";
  console.error("gac-print.html build error:", e);
}

// ---- Back to game ----
const backBtn = document.getElementById("backBtn");
if (backBtn) backBtn.onclick = () => {
  if (window.history.length > 1) window.history.back();
  else window.location.href = "index.html";
};

// ---- Repaint guard: some mobile browsers leave the page unpainted after the
// print dialog closes. Nudge a reflow so it reappears. ----
function repaint(){
  document.body.style.transform = "translateZ(0)";
  requestAnimationFrame(() => { document.body.style.transform = ""; });
}
window.addEventListener("afterprint", repaint);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") repaint();
});
</script>
</body>
</html>
